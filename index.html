<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
<title>SassyCat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="chat" id="chat" role="dialog" aria-label="Chat with SassyCat" inert>
  <header>
    <h1>SassyCat</h1>
    <button class="close" id="close" type="button" aria-label="Close chat">&times;</button>
  </header>
  <div class="messages" id="messages" role="log" aria-live="polite"></div>
  <form class="composer" id="composer" autocomplete="off">
    <input id="input" type="text" placeholder="Say something. If you dare." maxlength="300" aria-label="Your message">
    <button type="submit">Send</button>
  </form>
</div>

<div class="pet">
  <div class="zzz" id="zzz" aria-hidden="true"></div>
  <button class="cat" id="cat" type="button" aria-label="Open chat with SassyCat" aria-expanded="false"></button>
</div>

<script src="renderer.js"></script>
</body>
</html>
